<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<style>
		.bg { fill: #f3f4f6; }
		.text { 
			fill: #111827; 
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			font-weight: 600;
			letter-spacing: 1.2px;
		}
		.ring { stroke: #3b82f6; stroke-width: 3; fill: none; }

		@media (prefers-color-scheme: dark) {
			.bg { fill: #0b1220; }
			.text { fill: #e5e7eb; }
			.ring { stroke: #60a5fa; }
		}
	</style>

	<rect class="bg" width="64" height="64" rx="14"/>
	<rect x="3" y="3" width="58" height="58" rx="12" class="ring"/>

	<text 
		x="50%" 
		y="54%" 
		text-anchor="middle" 
		dominant-baseline="middle" 
		font-size="24" 
		class="text">
		AW
	</text>
</svg>